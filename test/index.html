<style>
:root{
  /* Layout: app a colonna singola, header fisso con ricerca; pensata per il telefono */
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2129; --muted:#5d6672; --line:#dde1e6;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#0a4d57; --accent:#2b3440; --accent-ink:#ffffff; --accent-soft:#e8ebef;
  --bas:#1d6a2b; --bas-soft:#e1efe3; --ava:#e30613; --ava-soft:#fde2e4;
  --c-man:#c8102e; --c-att:#b8862b; --c-att-ink:#8a6114; --c-cap:#7a8594; --c-cir:#2457c5; --c-bug:#7a3fb5; --cs-saf:#2457c5; --cs-sicurezza:#d35400; --cs-cra:#00838f; --cs-utili:#ad1457; --cs-cm:#8a5a2b;
  --a0:#c8102e; --a1:#e06c00; --a2:#0f7a8a; --a3:#2e8b3e; --a4:#2457c5; --a5:#7a3fb5; --a6:#b8860b; --a7:#5b6b7f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-man:#ff5a6e; --c-att:#d6a24a; --c-att-ink:#d6a24a; --c-cap:#a3adb9; --c-cir:#6f9bff; --c-bug:#b98bf0; --cs-saf:#6f9bff; --cs-sicurezza:#ff9a3c; --cs-cra:#3cc3d4; --cs-utili:#f06292; --cs-cm:#d0a070; --a0:#ff4d63; --a1:#ff9a3c; --a2:#3cc3d4; --a3:#5fd06f; --a4:#6f9bff; --a5:#b98bf0; --a6:#e6b84a; --a7:#9aa8b8;
  --bg:#12161b; --surface:#1b2129; --ink:#e8ebef; --muted:#9aa4b0; --line:#2c343e;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#3fa3b3; --accent:#fdeb05; --accent-ink:#14181d; --accent-soft:#2c343e;
  --bas:#4cb25c; --bas-soft:#15301d; --ava:#ff3b45; --ava-soft:#3d1417; color-scheme:dark;}}
:root[data-theme="dark"]{
  --c-man:#ff5a6e; --c-att:#d6a24a; --c-att-ink:#d6a24a; --c-cap:#a3adb9; --c-cir:#6f9bff; --c-bug:#b98bf0; --cs-saf:#6f9bff; --cs-sicurezza:#ff9a3c; --cs-cra:#3cc3d4; --cs-utili:#f06292; --cs-cm:#d0a070; --a0:#ff4d63; --a1:#ff9a3c; --a2:#3cc3d4; --a3:#5fd06f; --a4:#6f9bff; --a5:#b98bf0; --a6:#e6b84a; --a7:#9aa8b8;
  --bg:#12161b; --surface:#1b2129; --ink:#e8ebef; --muted:#9aa4b0; --line:#2c343e;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#3fa3b3; --accent:#fdeb05; --accent-ink:#14181d; --accent-soft:#2c343e;
  --bas:#4cb25c; --bas-soft:#15301d; --ava:#ff3b45; --ava-soft:#3d1417; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:3px solid var(--brand);padding:10px 16px 12px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{flex:1;min-width:0;color:var(--ink);font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;margin:0;cursor:pointer;display:flex;align-items:center;gap:10px}
.brand span{background:var(--brand);color:var(--brand-ink);padding:0 7px;border-radius:5px}
.brand img{display:block}
@media (max-width:440px){.proto{display:none}.brand{font-size:1.3rem;gap:7px;white-space:nowrap}.brand img,a.puma img{width:44px;height:44px}.ver{font-size:.62rem;padding:1px 5px}}
@media (max-width:370px){.brand{font-size:1.12rem}}
@media (max-width:440px){.top.sub .brand{font-size:1.12rem}.top.sub .brand img,.top.sub .puma img{width:38px;height:38px}}
@media (max-width:390px){.top.sub{gap:6px}.top.sub .brand{font-size:1rem;gap:5px}.top.sub .brand img,.top.sub .puma img{width:32px;height:32px}.top.sub .back{padding:0 2px}}
.bts{font-family:var(--body,system-ui);font-size:.62em;font-weight:600;color:var(--muted);letter-spacing:0}
.bt{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btw{font-style:normal;display:flex;align-items:baseline;gap:8px;min-width:0}
.ver{flex:0 0 auto;position:relative;top:0;font-family:var(--body,system-ui);font-size:.7rem;font-weight:600;letter-spacing:0;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.proto{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto}
.back{border:0;background:none;font-size:1.4rem;color:var(--ink);cursor:pointer;padding:0 4px;display:none;line-height:0}
.back svg{display:block}
.search{display:flex;gap:8px}
#q{flex:1;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.levels{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.levels::-webkit-scrollbar{display:none}
.lvwrap{position:relative;min-width:0}
.lvar{position:absolute;top:0;bottom:2px;width:46px;border:0;padding:0;font-size:1.9rem;font-weight:700;line-height:1;color:var(--ink);cursor:pointer;z-index:1;display:flex;align-items:center}
.lvar[hidden]{display:none}
.lvar.r{right:0;justify-content:flex-end;padding-right:2px;background:linear-gradient(90deg,transparent,var(--surface) 55%)}
.lvar.l{left:0;justify-content:flex-start;padding-left:2px;background:linear-gradient(270deg,transparent,var(--surface) 55%)}
.lv{flex:0 0 auto;white-space:nowrap}
.menu{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.menu svg{width:22px;height:22px}
.search .menu{height:auto;width:56px;border-radius:8px}
.search .menu svg{width:30px;height:30px}
#q,.search .menu{border:1.5px solid #fdeb05}
#q:focus{outline:2px solid #fdeb05;outline-offset:1px}
.tool{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-decoration:none}
.tool .ico{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem;color:#fff;background:var(--tc)}
.tool b{font-family:var(--display);font-size:1.2rem}
.tool p{margin:0;color:var(--muted);font-size:.9rem}
.soon{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle;font-family:var(--body)}
.norm{display:grid;gap:6px}
.normbody{padding:0 14px 14px;display:grid;gap:10px}
.normbody p{margin:0}
.normbody .nt{font-weight:600}
.normbody h4{margin:4px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lv{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.lv[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.info{flex:0 0 auto;margin-left:auto;border:2px solid var(--brand-ink);background:var(--brand);color:var(--brand-ink);border-radius:999px;width:36px;height:36px;font:700 1.15rem Georgia,serif;font-style:italic;box-shadow:0 2px 6px #0003;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:18px}
h2{font-family:var(--display);font-size:1.45rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-decoration:none;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:1.25rem}
.tile small{color:var(--muted);font-variant-numeric:tabular-nums}
.tile{border-top:4px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 12%,var(--surface)),var(--surface))}
.tile b{color:var(--tc)}
.k-man{--tc:var(--petrol)}.k-alt{--tc:var(--c-cap)}.k-cir{--tc:var(--c-cir)}.k-bug{--tc:var(--c-bug)}
.row{border-left:4px solid var(--rc,transparent)}
.t-manovra{--rc:var(--c-man)}.t-attrezzatura{--rc:var(--c-att)}.t-capitolo{--rc:var(--c-cap)}.t-cir{--rc:var(--c-cir)}.t-bug{--rc:var(--c-bug)}
.row .num{color:var(--rc,var(--muted))}
.t-attrezzatura .num{color:var(--c-att-ink)}

.sdcall{padding:5px 12px;font-size:.95rem;min-height:0}.sdmini{padding:8px 0;border-bottom:1px solid var(--line)}.sdmini:last-child{border:0}
.sdrow .num{font-size:.8rem}
.sdql{display:block;margin:14px 0 6px}.sdtop{position:relative}
.sdtipo{display:inline-block;font-size:1rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--chip,#2a2f36);border:1px solid var(--line)}
.sdsede{margin-top:10px;grid-template-columns:max-content 1fr;align-items:center}.sdsede dd{min-width:0;overflow-wrap:anywhere}
.sdinfo .meta{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px}.sdinfo .meta dd{min-width:0;overflow-wrap:anywhere;text-align:right}
.sdcard,.sdinfo{min-width:0;overflow-wrap:anywhere}.sdcall{white-space:nowrap}
#sd-q{box-sizing:border-box;padding:12px 14px;font-size:1rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.leaflet-container{font:inherit}
.szdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.card.lab{border-left:5px solid var(--lc);--gc:var(--lc)}
.fold,a.card.tool,.calc,.mcard,.card.lab{
 background:linear-gradient(180deg,var(--glass-hi) 0,transparent 38%,transparent 62%,var(--glass-lo) 100%),
  radial-gradient(130% 160% at 0% 50%,color-mix(in srgb,var(--gc) 9%,transparent) 0,transparent 60%),var(--surface);
 box-shadow:inset 1px 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo),var(--glass-sh),-5px 0 16px -9px color-mix(in srgb,var(--gc) calc(var(--glass-glow)*100%),transparent)}

.btn.shr.sm{padding:8px 12px;margin-top:6px}
button.seg-l{background:none;border:0;font:inherit;cursor:pointer;padding:0;margin-right:14px}
.qzo{display:grid;gap:8px;margin:12px 0}

.qzb.ko{border-color:#d3202a;background:color-mix(in srgb,#d3202a 18%,var(--surface))}

.glidx{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;position:sticky;top:0}
.glidx a{min-width:30px;text-align:center;padding:5px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:.85rem}
.gll{margin:16px 0 4px;font-family:var(--display);color:#fdeb05;border-bottom:2px solid #fdeb05;display:inline-block}
.glq{width:100%;box-sizing:border-box}

#novita h3{margin:0 0 4px;font-family:var(--display)}#novita ul{margin:4px 0 8px;padding-left:20px}

 "norme": {
  "166": {
   "titolo": "Protezione personale degli occhi",
   "spiegazione": "Requisiti generali per occhiali e visiere di protezione: resistenza meccanica agli urti, qualità ottica e marcatura delle lenti e delle montature."
  },
  "341": {
   "titolo": "Dispositivi di discesa per salvataggio",
   "spiegazione": "Discensori per salvataggio: permettono a una persona di scendere da sola, o di essere calata da un ancoraggio, a velocità controllata fino a un luogo sicuro. Il fabbricante deve dichiarare il carico minimo e massimo ammesso (massimo almeno 100 kg): molti dispositivi sono certificati fino a 200 kg o più, quindi anche per calare due persone insieme (operatore con infortunato), purché il bugiardino lo indichi espressamente. La sigla riporta tipo e classe (es. 2A): la classe, da A a D, indica l'energia di discesa sopportata, cioè altezza e numero di discese. Nota: la EN 341 non è armonizzata come DPI, per cui la marcatura CE di questi attrezzi si riferisce di solito ad altre norme (es. EN 12841)."
  },
  "353": {
   "titolo": "Dispositivi anticaduta di tipo guidato",
   "spiegazione": "Dispositivi che scorrono lungo una linea di ancoraggio rigida (parte 1) o flessibile (parte 2) e si bloccano automaticamente in caso di caduta."
  },
  "354": {
   "titolo": "Cordini",
   "spiegazione": "Cordini di collegamento (fune, fettuccia o catena) usati come elemento di un sistema anticaduta o di trattenuta. Lunghezza massima 2 m, compresi connettori ed eventuale assorbitore."
  },
  "355": {
   "titolo": "Assorbitori di energia",
   "spiegazione": "Elementi che si lacerano o si deformano durante l'arresto di una caduta, limitando la forza trasmessa al corpo dell'operatore a non più di 6 kN."
  },
  "358": {
   "titolo": "Cinture di posizionamento sul lavoro e cordini di posizionamento",
   "spiegazione": "Sostengono l'operatore nella posizione di lavoro o gli impediscono di raggiungere il punto in cui potrebbe cadere. Non sono progettati per arrestare una caduta libera."
  },
  "360": {
   "titolo": "Dispositivi anticaduta di tipo retrattile",
   "spiegazione": "Dispositivi con fune o nastro che si avvolge automaticamente e si blocca in caso di caduta, come una cintura di sicurezza dell'auto."
  },
  "361": {
   "titolo": "Imbracature per il corpo",
   "spiegazione": "Imbracature complete anticaduta: sono l'unico tipo di imbracatura ammesso per arrestare una caduta. I punti di attacco anticaduta (sternale e dorsale) sono marcati con la lettera A."
  },
  "362": {
   "titolo": "Connettori",
   "spiegazione": "Moschettoni e maglie per i sistemi di protezione contro le cadute. Le classi indicano l'impiego: B base, M multiuso (caricabile anche sull'asse minore), Q a ghiera da avvitare (maglia rapida), T terminale, A di ancoraggio."
  },
  "363": {
   "titolo": "Sistemi di protezione individuale contro le cadute",
   "spiegazione": "Descrive come si combinano i componenti nei diversi sistemi: trattenuta, posizionamento sul lavoro, accesso con fune, arresto caduta e salvataggio."
  },
  "365": {
   "titolo": "Requisiti generali per istruzioni, manutenzione, ispezione e marcatura",
   "spiegazione": "Stabilisce cosa devono contenere le note informative dei DPI contro le cadute (i bugiardini) e prescrive l'esame periodico da parte di persona competente, almeno ogni 12 mesi."
  },
  "397": {
   "titolo": "Elmetti di protezione per l'industria",
   "spiegazione": "Con la revisione EN 397:2025 (in Italia UNI EN 397:2026) gli elmetti sono divisi in due tipi. Tipo 1: protezione dagli urti sulla sommità del capo, come la vecchia EN 397:2012; il sottogola è facoltativo. Tipo 2: protezione anche dagli urti laterali, frontali e posteriori, prova d'urto dall'alto più severa e sottogola obbligatorio e più resistente: è il tipo adatto al lavoro in quota e in sospensione. La marcatura OCP, facoltativa per entrambi, indica la resistenza alla perforazione anche fuori dalla sommità. Fino al 16/12/2027 si possono ancora produrre elmetti secondo la vecchia edizione 2012."
  },
  "564": {
   "titolo": "Attrezzatura per alpinismo – Cordino",
   "spiegazione": "Cordini in fibra tessile con diametro da 4 a 8 mm, usati per anelli, nodi autobloccanti e collegamenti."
  },
  "566": {
   "titolo": "Attrezzatura per alpinismo – Anelli",
   "spiegazione": "Anelli in fettuccia o cordino cuciti o annodati, usati per ancoraggi, frazionamenti e collegamenti."
  },
  "567": {
   "titolo": "Attrezzatura per alpinismo – Bloccanti",
   "spiegazione": "Dispositivi che scorrono sulla corda in un senso e si bloccano nell'altro: maniglie, bloccanti ventrali e da piede."
  },
  "568": {
   "titolo": "Attrezzatura per alpinismo – Ancoraggi da ghiaccio",
   "spiegazione": "Ancoraggi da inserire nel ghiaccio, come le viti da ghiaccio, con requisiti di resistenza al carico."
  },
  "569": {
   "titolo": "Attrezzatura per alpinismo – Chiodi",
   "spiegazione": "Chiodi da roccia da piantare nelle fessure, con requisiti di resistenza secondo la direzione del carico."
  },
  "795": {
   "titolo": "Dispositivi di ancoraggio",
   "spiegazione": "Punti di ancoraggio per la protezione contro le cadute. Tipo A fissi su struttura, tipo B mobili e provvisori (come treppiedi e fettucce di ancoraggio), tipo C linee flessibili orizzontali, tipo D rotaie rigide, tipo E a corpo morto."
  },
  "813": {
   "titolo": "Cinture con cosciali",
   "spiegazione": "Imbracature basse con punto di attacco ventrale, per il posizionamento sul lavoro e l'accesso con fune. Da sole non sono un sistema di arresto caduta."
  },
  "892": {
   "titolo": "Attrezzatura per alpinismo – Corde dinamiche",
   "spiegazione": "Corde elastiche che assorbono l'energia di una caduta allungandosi. Possono essere intere, mezze o gemellari; la norma indica il numero di cadute normalizzate sopportate."
  },
  "893": {
   "titolo": "Attrezzatura per alpinismo – Ramponi",
   "spiegazione": "Ramponi da fissare agli scarponi per la progressione su neve dura e ghiaccio."
  },
  "958": {
   "titolo": "Dissipatori di energia per vie ferrate",
   "spiegazione": "Sistemi con due rami e dissipatore per la progressione su vie ferrate, che limitano la forza d'arresto in caso di caduta."
  },
  "959": {
   "titolo": "Ancoraggi per roccia",
   "spiegazione": "Ancoraggi fissi da installare in fori nella roccia (a espansione o resinati), con requisiti di resistenza a trazione e taglio."
  },
  "1077": {
   "titolo": "Caschi per sciatori",
   "spiegazione": "Caschi per lo sci alpino e lo snowboard, provati per urti tipici delle cadute sulla neve."
  },
  "1496": {
   "titolo": "Dispositivi di sollevamento per salvataggio",
   "spiegazione": "Dispositivi (per esempio verricelli e argani) che sollevano o calano una persona da un luogo pericoloso a uno sicuro."
  },
  "1497": {
   "titolo": "Imbracature di salvataggio",
   "spiegazione": "Imbracature da far indossare alla persona da soccorrere per sollevarla o calarla con un dispositivo di salvataggio."
  },
  "14987": {
   "titolo": "Cinghie di salvataggio",
   "spiegazione": "Cinghie o triangoli di evacuazione per il recupero e il trasporto della persona da salvare (titolo come riportato nel Manuale Basico)."
  },
  "1891": {
   "titolo": "Corde con guaina a basso coefficiente di allungamento",
   "spiegazione": "Corde semistatiche per accesso con fune, posizionamento e salvataggio. Tipo A per uso professionale e soccorso, tipo B con prestazioni inferiori."
  },
  "12275": {
   "titolo": "Attrezzatura per alpinismo – Connettori",
   "spiegazione": "Moschettoni per alpinismo. I tipi indicano la forma e l'impiego: B base, H a pera per mezzo barcaiolo, K per vie ferrate, X ovale, D direzionale, Q a ghiera."
  },
  "12277": {
   "titolo": "Attrezzatura per alpinismo – Imbracature",
   "spiegazione": "Imbracature per alpinismo: tipo A completa, tipo B piccola completa (per bambini), tipo C bassa, tipo D pettorale."
  },
  "12278": {
   "titolo": "Attrezzatura per alpinismo – Pulegge",
   "spiegazione": "Carrucole per alpinismo e soccorso, con requisiti di resistenza e di efficienza."
  },
  "12312": {
   "titolo": "Occhiali da sole (EN ISO 12312-1)",
   "spiegazione": "Protezione degli occhi dalla radiazione solare, importante su neve e ghiacciaio."
  },
  "12492": {
   "titolo": "Attrezzatura per alpinismo – Caschi per alpinisti",
   "spiegazione": "Caschi che proteggono da urti dall'alto, laterali, frontali e posteriori. Il sottogola trattiene il casco in testa anche in caso di caduta. Per l'uso lavorativo il suo ruolo è stato in gran parte assorbito dalla EN 397:2025 Tipo 2, che ha requisiti simili."
  },
  "12841": {
   "titolo": "Sistemi di accesso con fune – Dispositivi di regolazione della fune",
   "spiegazione": "Tipo A: anticaduta sulla linea di sicurezza. Tipo B: bloccanti di risalita sulla linea di lavoro. Tipo C: discensori sulla linea di lavoro."
  },
  "13089": {
   "titolo": "Attrezzatura per alpinismo – Attrezzi da ghiaccio",
   "spiegazione": "Piccozze e martelli da ghiaccio, con requisiti di resistenza diversi per uso alpinistico di base o tecnico."
  },
  "15151-1": {
   "titolo": "Dispositivi di frenatura con bloccaggio manuale assistito",
   "spiegazione": "Freni per la sicura in alpinismo che aiutano l'operatore a bloccare la corda (per esempio discensori assicuratori autofrenanti)."
  },
  "15151-2": {
   "titolo": "Dispositivi di frenatura manuale",
   "spiegazione": "Freni per la sicura in cui il bloccaggio dipende dalla mano dell'operatore (per esempio piastrine e secchielli)."
  },
  "16473": {
   "titolo": "Caschi per vigili del fuoco – Soccorso tecnico",
   "spiegazione": "Caschi per vigili del fuoco impegnati nel soccorso tecnico, compreso il soccorso in quota e in ambiente impervio."
  },
  "15151": {
   "titolo": "Attrezzatura per alpinismo – Dispositivi di frenatura",
   "spiegazione": "Freni per la sicura in alpinismo. La parte 1 riguarda i dispositivi con bloccaggio manuale assistito, la parte 2 quelli a frenatura manuale."
  },
  "1498": {
   "titolo": "Cinghie di salvataggio",
   "spiegazione": "Cinghie e anelli di salvataggio che, indossati sotto le ascelle o in vita, permettono di sollevare o calare una persona durante un soccorso. Classi A, B e C a seconda della forma e dell'uso."
  },
  "13157": {
   "titolo": "Apparecchi di sollevamento azionati a mano",
   "spiegazione": "Norma di sicurezza per argani e paranchi manuali usati come macchine di sollevamento (non specifica per i DPI). Si affianca alla EN 1496 nei verricelli usati anche per il soccorso."
  },
  "137": {
   "titolo": "Autorespiratori a circuito aperto ad aria compressa",
   "spiegazione": "Requisiti degli autorespiratori con maschera intera usati dai Vigili del Fuoco. Compare nei sistemi di posizionamento integrati sul telaio dell'autorespiratore."
  },
  "16415": {
   "sigla": "CEN/TS 16415",
   "titolo": "Dispositivi di ancoraggio per più utilizzatori",
   "spiegazione": "Specifica tecnica che integra la EN 795 per gli ancoraggi usati da più persone contemporaneamente: l'attrezzo deve dichiarare il numero massimo di utenti (es. tipo B fino a 2 persone)."
  },
  "1983": {
   "sigla": "NFPA 1983",
   "titolo": "Corde e attrezzature per il soccorso (USA)",
   "spiegazione": "Norma statunitense della National Fire Protection Association per corde, connettori e attrezzi da soccorso dei vigili del fuoco. Non vale come marcatura CE ma indica attrezzi pensati per carichi da soccorso (classi \"technical use\" e \"general use\"). Dal 2022 è confluita nella NFPA 2500."
  },
  "1865-1": {
   "titolo": "Barelle e attrezzature per il trasporto dei pazienti",
   "spiegazione": "Norma per le barelle e i dispositivi di trasporto del paziente in ambulanza e nel soccorso. Le barelle sanitarie sono dispositivi medici (Reg. UE 2017/745) e non DPI."
  }
 },

const normBase = n => { const s = String(n); if (/^ANSI/.test(s)) return; const m = s.match(/(?:EN|TS|NFPA)\s?(\d{3,5}(?:-\d)?)/) || s.match(/(\d{3,5}(?:-\d)?)/); let k = m && m[1]; if (k && !D.norme[k] && D.norme[k.split('-')[0]]) k = k.split('-')[0]; return k; };

function normIndex() {
  const idx = {};

  Object.keys(D.norme).forEach(get);
  D.bugiardini.forEach(b => (b.norme || []).forEach(n => { const k = normBase(n); if (k) get(k).bug.push(b); }));
  D.argomenti.forEach(a => a.sinonimi.forEach(x => { if (/EN ?\d/.test(x)) { const k = normBase(x); if (k) get(k).arg.push(a); } }));

}

/* ===================== RICERCA NEL TESTO DEI PDF ===================== */
const TXT_URL = window.SAF_TXT || 'https://saf-vvf.github.io/saf-documenti/testo.json';
let TXT = null, TXTP = null, ftsTok = 0;
function docInfo() {
  const m = {};
  D.manuali.forEach(x => m[x.url] = {t: x.titolo, k: 'Manuale', c: 'var(--c-man)'});
  D.altri_manuali.forEach(x => m[x.url] = {t: x.sigla + ' – ' + x.titolo, k: 'Altri manuali', c: '#8a5a2b'});
  D.bugiardini.forEach(x => m[x.url] = {t: brand(x) + ' ' + x.titolo, k: 'Bugiardino', c: 'var(--c-bug)'});
  D.circolari.forEach(c => { m[c.url] = {t: (c.etichetta ? c.etichetta + ' ' : '') + (c.descrizione || c.titolo), k: 'Circolare', c: 'var(--c-cir)'}; (c.allegati || []).forEach(a => m[a.url] = {t: a.n + ' – ' + a.titolo + ' (' + (c.etichetta || c.numero) + ')', k: 'Allegato', c: 'var(--c-cir)'}); });
  if (D.sacche) m[D.sacche.fonte.url] = {t: D.sacche.fonte.titolo, k: 'Capitolato', c: '#e07000'};
  return m;
}
async function ftsLoad() {
  if (TXT) return TXT;
  let j = null;
  try { const r = await fetch(TXT_URL, {cache: 'no-cache'}); if (r.ok) { j = await r.json(); try { const c = await caches.open('saf-testo'); await c.put('testo', new Response(JSON.stringify(j))); } catch (e) {} } } catch (e) {}
  if (!j) { try { const c = await caches.open('saf-testo'); const r = await c.match('testo'); if (r) j = await r.json(); } catch (e) {} }
  if (!j) return null;
  TXT = j; TXTP = {};
  for (const u in j) { TXTP[u] = {}; for (const p in j[u]) TXTP[u][p] = norm(j[u][p]); }
  return TXT;
}
function ftsSnip(text, ntext, words) {
  const i = Math.max(0, ntext.indexOf(words[0]));
  const a = Math.max(0, i - 70), b = Math.min(text.length, i + 130);
  let s = esc(text.slice(a, b));
  words.forEach(w => { const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); s = s.replace(re, '<mark>$1</mark>'); });
  return (a ? '… ' : '') + s + (b < text.length ? ' …' : '');
}
async function ftsRun(q) {
  const box = document.getElementById('fts'); if (!box) return;
  const tok = ++ftsTok;
  const words = norm(q).split(/\s+/).filter(w => w.length > 2 || /\d/.test(w));
  if (!words.length) { box.innerHTML = ''; return; }
  const j = await ftsLoad(); if (tok !== ftsTok) return;
  if (!j) { box.innerHTML = '<h3>Nel testo dei documenti</h3><p class="note">Testo dei documenti non disponibile: serve la connessione la prima volta.</p>'; return; }
  const info = docInfo(), res = [];
  for (const u in TXTP) {
    const hits = [];
    for (const p in TXTP[u]) { const t = TXTP[u][p]; if (words.every(w => t.includes(w))) hits.push(+p); }
    if (hits.length && info[u]) res.push({u, hits: hits.sort((a, b) => a - b), i: info[u]});
  }
  res.sort((a, b) => b.hits.length - a.hits.length);
  const tot = res.reduce((s, r) => s + r.hits.length, 0);
  if (!res.length) { box.innerHTML = '<h3>Nel testo dei documenti</h3><p class="note">Nessuna pagina contiene tutte le parole cercate.</p>'; return; }
  box.innerHTML = `<h3>Nel testo dei documenti (${tot} pagine in ${res.length} documenti)</h3>` + res.slice(0, 25).map(r => `<details class="fold ftsd" style="--fc:${r.i.c}"><summary><span>${esc(r.i.t)}</span><small>${r.hits.length} pag.</small></summary><div class="list">${r.hits.slice(0, 12).map(p => `<a class="row" href="${pdf(r.u, p)}"><span class="num">p. ${p}</span><span class="t ftss">${ftsSnip(TXT[r.u][p], TXTP[r.u][p], words)}</span><span class="s">${esc(r.i.k)}</span></a>`).join('')}${r.hits.length > 12 ? `<p class="note" style="margin:6px 12px">… e altre ${r.hits.length - 12} pagine: affina la ricerca con più parole.</p>` : ''}</div></details>`).join('') + (res.length > 25 ? `<p class="note">Mostrati i primi 25 documenti su ${res.length}.</p>` : '') + '<p class="note">I documenti scansionati sono stati letti con il riconoscimento automatico del testo: qualche parola può mancare.</p>';
}

const MSIG = {'man-basico-2021': 'Basico', 'man-avanzato-2023': 'Avanzato', 'man-el-2025': 'EL', 'man-negh-2025': 'NeGh'};
const glossRow = (g, open) => { const m = MAN[g.m]; return `<details class="gl" style="--rc:var(--lv-${m.livello})"${open ? ' open' : ''}><summary><b>${esc(g.t)}</b><small>${esc(MSIG[g.m] || '')}</small></summary><p>${esc(g.d)}</p>${g.nota ? `<p class="note" style="margin:0 0 6px">${esc(g.nota)}</p>` : ''}<a class="glsrc" href="${pdf(m.url, g.p)}">Apri ${esc(m.titolo)} · pag. ${g.p}</a></details>`; };
const glossVis = () => (D.glossario || []).filter(g => MAN[g.m] && lvOk(MAN[g.m].livello));
function viewGlossario() {
  const G = glossVis();

  return `<h2>Glossario SAF</h2><p class="note">${G.length} termini${levels.size ? ' per ' + [...levels].map(l => LIV[l] ? LIV[l].nome : l).join(', ') : ' dai glossari dei manuali Basico, Avanzato, Elisoccorritori e Neve-Ghiaccio-Valanghe'}. Usa i filtri in alto per vedere solo i termini delle tue specializzazioni; tocca la fonte per aprire la pagina del manuale.</p>
  <input class="skid glq" id="glq" placeholder="Filtra i termini (es. ancoraggio, valanga, WLL)" autocomplete="off">
  <div class="glidx">${L.map(l => `<a href="#gl-${l}" data-l="${l}">${l}</a>`).join('')}</div>
  <div id="gllist">${L.map(l => `<h3 class="gll" id="gl-${l}">${l}</h3>` + G.filter(g => norm(g.t)[0].toUpperCase() === l).map(g => glossRow(g)).join('')).join('')}</div>`;
}
function bindGlossario() {
  const q = document.getElementById('glq'); if (!q) return;
  document.querySelectorAll('.glidx a').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById('gl-' + a.dataset.l)?.scrollIntoView({behavior: 'smooth'}); });
  q.oninput = () => { const w = norm(q.value).trim(); const box = document.getElementById('gllist');
    if (!w) { box.innerHTML = viewGlossario().split('<div id="gllist">')[1].replace(/<\/div>$/, ''); return; }
    const r = glossVis().filter(g => norm(g.t + ' ' + g.d).includes(w)).sort((a, b) => (norm(b.t).includes(w)) - (norm(a.t).includes(w)));
    box.innerHTML = r.length ? r.map(g => glossRow(g, r.length <= 3)).join('') : '<p class="empty">Nessun termine trovato.</p>'; };
}

const PAR = [
  {n: '1:1 – rinvio semplice (cambio di direzione)', s: [1]}, {n: '2:1 – carrucola mobile', s: [2]}, {n: '3:1 – paranco a Z', s: [3]},
  {n: '4:1 – semplice', s: [4]}, {n: '5:1 – semplice', s: [5]},
  {n: '4:1 – composto (2:1 su 2:1)', s: [2, 2]}, {n: '6:1 – composto (2:1 su 3:1)', s: [2, 3]}, {n: '9:1 – composto (3:1 su 3:1)', s: [3, 3]}];
function bindCalcoli() {
  if (!document.getElementById('ca-o')) return;
  const v = id => parseFloat(String(document.getElementById(id).value).replace(',', '.')) || 0;
  const f0 = x => x.toLocaleString('it-IT', {maximumFractionDigits: 0}), f1 = x => x.toLocaleString('it-IT', {maximumFractionDigits: 1});
  const up = () => {
    const w = v('ca-w'), a = v('ca-a'); document.getElementById('ca-av').textContent = a + '°';
    const F = w / (2 * Math.cos(a * Math.PI / 360));
    document.getElementById('ca-o').innerHTML = `Ogni ancoraggio: <b>${f0(F)} kg</b> (${f0(F / w * 100 || 0)}% del carico)${a > 120 ? '<br><span class="warn">Oltre 120° ogni ancoraggio riceve più del carico intero.</span>' : a > 90 ? '<br><span class="warn">Oltre 90° le forze crescono rapidamente: chiudi l\'angolo se possibile.</span>' : ''}`;
    const t = v('cr-t'), b = v('cr-a'); document.getElementById('cr-av').textContent = b + '°';
    const R = 2 * t * Math.cos(b * Math.PI / 360);
    document.getElementById('cr-o').innerHTML = `Forza sul rinvio: <b>${f0(R)} kg</b> (${f1(R / t || 0)} volte la tensione)${b < 60 ? '<br><span class="warn">Rami quasi paralleli: il rinvio riceve quasi il doppio della tensione.</span>' : ''}`;
    const P = PAR[+document.getElementById('cp-s').value], e = v('cp-e'), W = v('cp-w');
    const th = P.s.reduce((x, n) => x * n, 1);
    const real = P.s.reduce((x, n) => { let m = 0; for (let k = 0; k < n; k++) m += Math.pow(e, k); return x * (n === 1 ? e : m); }, 1);
    document.getElementById('cp-o').innerHTML = `Vantaggio teorico <b>${th}:1</b> · forza teorica ${f0(W / th)} kg<br>Vantaggio reale stimato <b>${f1(real)}:1</b> · forza da applicare circa <b>${f0(W / real)} kg</b>`;
    const h = v('cf-h'), l = v('cf-l'), ff = l ? h / l : 0;
    document.getElementById('cf-o').innerHTML = `Fattore di caduta <b>${f1(ff)}</b>${ff > 2 ? '<br><span class="warn">Valore oltre 2: possibile solo su cordini o ancoraggi mobili, situazione estremamente pericolosa.</span>' : ff >= 1 ? '<br><span class="warn">Fattore pari o superiore a 1: forze d\'arresto molto elevate, soprattutto con corde semistatiche e cordini senza assorbitore.</span>' : ff > 0.3 ? '<br>Caduta di media gravità.' : '<br>Caduta di lieve entità.'}`;
  };
  document.querySelectorAll('.calc input, .calc select').forEach(i => i.addEventListener('input', up));
  up();
}

/* ===================== QUIZ DI AUTOVERIFICA ===================== */
const QZ = {cat: '', q: [], i: 0, ok: 0, ans: null};
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let QSPEC = new Set();
try { const s = JSON.parse(localStorage.getItem('saf-quiz-spec') || 'null'); if (Array.isArray(s)) QSPEC = new Set(s); else if (levels.size) QSPEC = new Set([...levels].filter(x => ['basico', 'avanzato', 'elisoccorritore', 'negh'].includes(x))); } catch(e) {}
if (!QSPEC.size) QSPEC.add('basico');
const qzSave = () => { try { localStorage.setItem('saf-quiz-spec', JSON.stringify([...QSPEC])); } catch(e) {} };
// Avanzato comprende Basico e SFA (requisiti di accesso); Elisoccorritore (manuale + appendice) e NeGh sono indipendenti.
const qzMan = () => { const m = new Set(); if (QSPEC.has('basico') || QSPEC.has('avanzato')) m.add('man-basico-2021'); if (QSPEC.has('avanzato')) m.add('man-avanzato-2023'); if (QSPEC.has('elisoccorritore')) { m.add('man-el-2025'); m.add('man-el-app-2025'); } if (QSPEC.has('negh')) m.add('man-negh-2025'); return m; };
const qzLv = () => { const l = new Set(['gen']); if (QSPEC.has('basico') || QSPEC.has('avanzato')) l.add('bas'); if (QSPEC.has('avanzato')) { l.add('ava'); l.add('cra'); } return l; };
function qzMake(cat) {
  const out = [], pick = (arr, n) => shuf(arr).slice(0, n), M = qzMan(), LV = qzLv();
  const opts = (right, pool) => shuf([right, ...pick([...new Set(pool)].filter(x => x !== right), 3)]);
  const SC = D.schede.filter(s => M.has(s.manuale));
  const NK = new Set(SC.flatMap(s => (s.norme || []).map(normBase)).filter(k => k && D.norme[k] && D.norme[k].titolo));
  const N = Object.entries(D.norme).filter(([k, n]) => n.titolo);
  const NS = N.filter(([k]) => NK.has(k));
  const lab = k => normLabel(k);
  const cut = (t, n) => t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t;
  if (cat === 'norme' || cat === 'mix') pick(NS, 8).forEach(([k, n]) => {
    if (Math.random() < .5) out.push({q: `Che cosa riguarda la norma ${lab(k)}?`, o: opts(n.titolo, N.map(x => x[1].titolo)), a: n.titolo, sp: n.spiegazione, h: '#n-' + k});
    else out.push({q: `Quale norma riguarda: “${n.titolo}”?`, o: opts(lab(k), N.map(x => lab(x[0]))), a: lab(k), sp: n.spiegazione, h: '#n-' + k});
  });
  if (cat === 'materiali' || cat === 'mix') {
    const S = SC.filter(s => s.tipo === 'attrezzatura' && (s.norme || []).length);
    pick(S, 8).forEach(s => { const k = normBase(s.norme[0]); if (!k || !D.norme[k]) return; out.push({q: `Quale norma è riportata nella scheda “${s.titolo}” (${MAN[s.manuale].titolo.replace(/^Manuale\s*/i, '')})?`, o: opts(lab(k), N.map(x => lab(x[0]))), a: lab(k), sp: 'Scheda ' + (s.n || '') + ' – norme: ' + s.norme.join(', '), h: '#s-' + s.id}); });
    const B = D.bugiardini.filter(b => b.produttore && D.produttori[b.produttore]);
    pick(B, 3).forEach(b => { const P = Object.values(D.produttori).map(p => p.nome); out.push({q: `Chi produce “${b.titolo.split(' – ')[0]}”?`, o: opts(D.produttori[b.produttore].nome, P), a: D.produttori[b.produttore].nome, sp: b.titolo, h: '#b-' + b.id}); });
  }
  if (cat === 'manovre' || cat === 'mix') {
    const S = SC.filter(s => s.tipo === 'manovra' && (s.argomenti || []).length);
    const AN = a => (D.argomenti.find(x => x.codice === a) || {}).nome || a;
    const pool = [...new Set(S.map(s => AN(s.argomenti[0])))];
    pick(S, 8).forEach(s => { const r = AN(s.argomenti[0]); out.push({q: `A quale argomento appartiene la manovra “${s.titolo}”?`, o: opts(r, pool.length >= 4 ? pool : D.argomenti.map(a => a.nome)), a: r, sp: 'Scheda ' + (s.n || '') + ' – ' + MAN[s.manuale].titolo + '.', h: '#s-' + s.id}); });
  }
  if (cat === 'glossario' || cat === 'mix') {
    const G = (D.glossario || []).filter(g => M.has(g.m) && g.d && g.d.length > 25);
    pick(G, 8).forEach(g => out.push({q: `Quale termine corrisponde a questa definizione: “${cut(g.d.replace(new RegExp(g.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…'), 220)}”`, o: opts(g.t, G.map(x => x.t)), a: g.t, sp: 'Glossario – ' + MAN[g.m].titolo + ', pag. ' + g.p + '.', h: '#t-glossario'}));
  }
  if (cat === 'circolari' || cat === 'mix') {
    const C = (D.quiz_circolari || []).filter(x => LV.has(x.lv) && CIR[x.c]);
    pick(C, cat === 'mix' ? 4 : 10).forEach(x => out.push({q: x.q, o: shuf([x.a, ...x.d]), a: x.a, sp: x.sp + ' (' + (CIR[x.c].etichetta || CIR[x.c].numero) + ')', h: '#c-' + x.c}));
  }
  return shuf(out).slice(0, 10);
}

    ${done ? `<p class="note" style="margin:0">${x.o[QZ.ans] === x.a ? '✓ Esatto.' : '✗ Risposta corretta: ' + esc(x.a) + '.'} ${esc(x.sp || '')} <a href="${x.h}">Apri la fonte</a></p><div class="btns"><button class="btn" id="qz-next">${QZ.i + 1 < QZ.q.length ? 'Avanti' : 'Risultato'}</button></div>` : ''}
    <p class="note" style="margin:0">Punteggio: ${QZ.ok}</p></div>
    <div class="btns" style="justify-content:center"><button class="btn ghost" id="qz-stop">✕ Interrompi quiz</button></div>`;

function bindQuiz() {
  document.querySelectorAll('.qzs').forEach(b => b.onclick = () => { const k = b.dataset.lv; if (QSPEC.has(k)) { if (QSPEC.size > 1) QSPEC.delete(k); } else QSPEC.add(k); qzSave(); render(); });

const MAIL = 'app.safe.vvf@gmail.com';
function segnalaHref(doc) {
  const sub = doc ? 'Segnalazione su: ' + doc : 'Segnalazione nuovo documento – SAFe';
  const body = doc ? `Documento: ${doc}\n\nCosa non va (errore, versione superata o più recente disponibile, pagina sbagliata…):\n\n\nNome e Comando (facoltativo):\n` :

/* messaggio di invito: i numeri tra graffe si calcolano sui contenuti attuali */
function invitoTxt() {

  const V = {versione: VER, manuali: D.manuali.filter(m => !m.parent).length, schede: D.schede.length, manovre: n('manovra'), materiali: n('attrezzatura'), circolari: D.circolari.length, bugiardini: D.bugiardini.length, produttori: Object.keys(D.produttori).length, altri: D.altri_manuali.length, glossario: g >= 20 ? Math.floor((g - 1) / 10) * 10 : g, norme: Object.keys(D.norme).length};

async function condividiApp() {

  const m = document.getElementById('shmsg');
  try { if (navigator.share) { await navigator.share({title: 'SAFe – Supporto Operatore', text: txt}); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt); if (m) m.textContent = 'Messaggio copiato: incollalo in WhatsApp, Telegram o in una mail.'; } catch (e) { if (m) m.textContent = 'Condivisione non disponibile: copia il link ' + url; }
}

  document.querySelectorAll('.tema-b').forEach(x => x.onclick = () => { try { localStorage.setItem('saf-tema', x.dataset.tema); } catch (e) {} temaApply(x.dataset.tema); document.querySelectorAll('.tema-b').forEach(y => y.setAttribute('aria-checked', String(y === x))); }); }
function novitaCheck() {
  const N = D.novita || []; if (!N.length) return;
  const id = n => n.id || n.data; let seen = null;
  /* confronto numerico: '2026-11-16.13' viene dopo '2026-11-16.3' */
  const key = v => { const [d, n] = String(v).split('.'); return [d, parseInt(n || '0', 10)]; };
  const newer = (a, b) => { const x = key(a), y = key(b); return x[0] > y[0] || (x[0] === y[0] && x[1] > y[1]); };
  const last = N.map(id).reduce((m, v) => newer(v, m) ? v : m);  /* la più recente, in qualunque ordine sia l'elenco */
  const segna = () => { try { const s = localStorage.getItem('saf-novita'); if (!s || newer(last, s)) localStorage.setItem('saf-novita', last); } catch (e) {} };
  try { seen = localStorage.getItem('saf-novita'); } catch (e) { return; }
  if (FIRSTRUN) { segna(); return; }  /* primo avvio assoluto: nessun messaggio */
  const iosWeb = () => window.SAF_SPLASH && /iPhone|iPad|iPod/.test(navigator.userAgent) && !(matchMedia('(display-mode: standalone)').matches || navigator.standalone);
  const nuove = N.filter(n => (!seen || newer(id(n), seen)) && (!n.solo || (n.solo === 'ios-browser' && iosWeb()))); if (!nuove.length) return;

  render();
});
window.addEventListener('popstate', () => { if (!inCerca() && (!location.hash || location.hash === '#home')) { $('#q').value = ''; render(); } });
{ const hb = document.getElementById('hb'); if (hb) hb.addEventListener('click', azzeraCerca); }
$('#sf').addEventListener('submit', e => { e.preventDefault(); $('#q').blur(); });
$('#brand').addEventListener('click', () => { if (inCerca() && (!location.hash || location.hash === '#home')) return azzeraCerca(); $('#q').value = ''; location.hash = 'home'; render(); });
$('#back').addEventListener('click', () => history.back());
/* conferma di uscita (solo app installata): compare solo quando si è già sulla prima pagina e si preme ancora Indietro.
   Chrome salta le voci di cronologia aggiunte senza un tocco dell'utente: per questo le "voci di guardia" (stessa pagina #home)
   si aggiungono una per volta, a ogni tocco sulla prima pagina, fino a GMAX. Indietro dalla prima pagina scende su una guardia
   e mostra la domanda; altri Indietro scendono sulle guardie successive senza uscire. */
(() => {
  if (!(window.matchMedia && (matchMedia('(display-mode: standalone)').matches || navigator.standalone)) || !history.pushState || !document.addEventListener) return;
  const base = location.pathname + location.search, GMAX = 5;
  let liv = 1, esco = false;
  history.replaceState({safeg: 1}, '', base + '#home');
  const aggiungi = () => { if (esco || document.getElementById('exitq')) return; const st = history.state; if (!st || st.safeg !== liv) return; while (liv < GMAX) { liv++; history.pushState({safeg: liv}, '', base + '#home'); } };
  document.addEventListener('click', aggiungi, true);
  window.addEventListener('popstate', e => {
    const g = e.state && e.state.safeg; if (!g || esco) return;
    const sceso = g < liv; liv = g;
    if (!sceso || document.getElementById('exitq')) return;
    const w = document.createElement('div'); w.id = 'exitq';
    w.innerHTML = '<div class="nv"><p style="margin:0 0 4px;font-size:1.15rem;font-weight:700">Vuoi uscire da SAFe?</p><div class="btns" style="justify-content:flex-end"><button class="btn ghost" id="ex-no">Resta</button><button class="btn" id="ex-si">Esci</button></div><p class="note" id="ex-m" style="margin:6px 0 0"></p></div>';
    document.body.appendChild(w);
    const resta = () => { w.remove(); esco = false; aggiungi(); };
    w.querySelector('#ex-no').onclick = resta; w.onclick = ev => { if (ev.target === w) resta(); };
    w.querySelector('#ex-si').onclick = ev => {
      ev.stopPropagation();
      try { window.close(); } catch (x) {}
      if (esco) return; esco = true;
      if (liv > 1) { history.go(1 - liv); liv = 1; }
      setTimeout(() => { const m = document.getElementById('ex-m'); if (m) m.textContent = 'Premi ancora Indietro per chiudere l\'app.'; }, 250);
    };
  });
})();
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== 'home') { } render(); window.scrollTo(0, 0); });

  s.innerHTML = `<img src="${src}" alt=""${window.SAF_SPLASH ? ' class="mk"' : ''}>`;
  const im = s.querySelector('img'); im.onerror = () => { im.onerror = null; im.className = ''; im.src = document.querySelector('#brand img').src; };
  document.body.appendChild(s);
  const hide = () => { s.classList.add('out'); setTimeout(() => s.remove(), 600); };

})();

/* --- statistiche anonime (GoatCounter, senza cookie): attive solo nell'app pubblicata --- */
(() => {
  const code = window.SAF_GC; if (!code) return;
  if (location.hash === '#toggle-goatcounter') {
    let off = false; try { off = localStorage.getItem('saf-gc-off') !== '1'; if (off) localStorage.setItem('saf-gc-off', '1'); else localStorage.removeItem('saf-gc-off'); } catch (e) {}
    const m = document.createElement('div'); m.style.cssText = 'position:fixed;left:12px;right:12px;bottom:20px;z-index:200;background:#000d;color:#fff;padding:14px;border-radius:10px;text-align:center;font-size:.95rem';
    m.textContent = off ? 'Statistiche disattivate su questo dispositivo: le tue aperture non verranno contate.' : 'Statistiche riattivate su questo dispositivo.';
    document.body.appendChild(m); setTimeout(() => m.remove(), 5000);
    history.replaceState(null, '', location.pathname + location.search + '#home');
  }
  try { if (localStorage.getItem('saf-gc-off') === '1') return; } catch (e) {}
  const hit = (p, t, ev) => { try { const u = `https://${code}.goatcounter.com/count?p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}${ev ? '&e=true' : ''}&rnd=${Math.random().toString(36).slice(2)}`; if (navigator.sendBeacon) navigator.sendBeacon(u); else new Image().src = u; } catch (e) {} };
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  try { if (!localStorage.getItem('saf-gc-dev')) { hit('nuovo-dispositivo', 'Nuovo dispositivo', true); localStorage.setItem('saf-gc-dev', '1'); } } catch (e) {}
  try { if (!sessionStorage.getItem('saf-gc-open')) { hit(standalone ? '/apertura-app' : '/apertura-browser', standalone ? 'Apertura app installata' : 'Apertura da browser'); sessionStorage.setItem('saf-gc-open', '1'); } } catch (e) {}
  window.addEventListener('appinstalled', () => hit('app-installata', 'App installata', true));
})();
