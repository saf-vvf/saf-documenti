<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181d">
<title>SAF – Visualizzatore PDF</title>
<style>
:root{--bg:#2a2f36;--bar:#14181d;--ink:#eef1f4;--muted:#9aa4b0;--accent:#ff4d63}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar)}
header b{flex:1;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
header a,header button{color:var(--ink);background:none;border:1px solid #3a424c;border-radius:6px;padding:6px 10px;font-size:.85rem;text-decoration:none;cursor:pointer}
#pages{display:grid;gap:10px;justify-items:center;padding:10px 6px 40px}
.pg{background:#fff;box-shadow:0 1px 4px #0006;position:relative}
.pg canvas{display:block;width:100%;height:100%}
.pg i{position:absolute;inset:auto 0 -18px 0;text-align:center;font-size:.7rem;color:var(--muted);font-style:normal}
#msg{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><button id="back" aria-label="Indietro">&#8592;</button><b id="title">Caricamento…</b><span id="count"></span><button id="zoomout" aria-label="Riduci">−</button><button id="zoomin" aria-label="Ingrandisci">+</button><a id="dl" href="#">Scarica</a></header>
<div id="msg"></div>
<div id="pages"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const params = new URLSearchParams(location.search);
const file = params.get('file') || '';
const start = parseInt((location.hash.match(/page=(\d+)/) || [])[1] || '1', 10);
const box = document.getElementById('pages');
let doc, zoom = 1, baseW = 0, rendered = new Map();
document.getElementById('dl').href = file;
document.getElementById('title').textContent = decodeURIComponent(file.split('/').pop());
if (!/^(pdf\/)?[\w.\-]+\.pdf$/.test(file)) {
  document.getElementById('msg').textContent = 'Documento non valido.';
} else {
  pdfjsLib.getDocument({url: file, disableRange: true, disableAutoFetch: true}).promise.then(async d => {
    doc = d;
    const p1 = await d.getPage(1);
    const v = p1.getViewport({scale: 1});
    baseW = v.width; const ratio = v.height / v.width;
    for (let i = 1; i <= d.numPages; i++) {
      const el = document.createElement('div');
      el.className = 'pg'; el.id = 'p' + i; el.dataset.n = i; el.dataset.ratio = ratio;
      el.innerHTML = '<i>' + i + '</i>';
      box.appendChild(el);
    }
    layout();
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) draw(+e.target.dataset.n); }), {rootMargin: '800px 0px'});
    box.querySelectorAll('.pg').forEach(el => io.observe(el));
    const target = document.getElementById('p' + Math.min(Math.max(start, 1), d.numPages));
    target.scrollIntoView();
    window.addEventListener('scroll', counter, {passive: true}); counter();
  }).catch(e => { document.getElementById('msg').textContent = 'Impossibile aprire il documento: ' + e.message; });
}
function width() { return Math.min(window.innerWidth - 12, 900) * zoom; }
function layout() {
  box.querySelectorAll('.pg').forEach(el => { const w = width(); el.style.width = w + 'px'; el.style.height = (w * el.dataset.ratio) + 'px'; });
}
async function draw(n) {
  if (rendered.get(n) === zoom) return; rendered.set(n, zoom);
  const page = await doc.getPage(n);
  const el = document.getElementById('p' + n);
  const w = width(); const vp0 = page.getViewport({scale: 1});
  el.style.height = (w * vp0.height / vp0.width) + 'px';
  const scale = w / vp0.width * (window.devicePixelRatio || 1);
  const vp = page.getViewport({scale});
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
  el.querySelector('canvas')?.remove(); el.prepend(c);
}
function counter() {
  if (!doc) return;
  let cur = 1; box.querySelectorAll('.pg').forEach(el => { if (el.getBoundingClientRect().top < window.innerHeight / 2) cur = +el.dataset.n; });
  document.getElementById('count').textContent = cur + ' / ' + doc.numPages;
}
function rezoom(f) {
  const cur = parseInt(document.getElementById('count').textContent) || 1;
  zoom = Math.min(3, Math.max(0.5, zoom * f)); rendered.clear(); layout();
  document.getElementById('p' + cur).scrollIntoView();
  box.querySelectorAll('.pg').forEach(el => { const r = el.getBoundingClientRect(); if (r.bottom > -800 && r.top < innerHeight + 800) draw(+el.dataset.n); });
}
document.getElementById('back').onclick = () => { if (history.length > 1) history.back(); else location.href = './'; };
document.getElementById('zoomin').onclick = () => rezoom(1.25);
document.getElementById('zoomout').onclick = () => rezoom(0.8);
</script>
</body>
</html>
