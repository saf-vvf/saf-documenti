<style>
:root{
  /* Layout: app a colonna singola, header fisso con ricerca; pensata per il telefono */
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2129; --muted:#5d6672; --line:#dde1e6;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#0a4d57; --accent:#2b3440; --accent-ink:#ffffff; --accent-soft:#e8ebef;
  --bas:#1d6a2b; --bas-soft:#e1efe3; --ava:#e30613; --ava-soft:#fde2e4;
  --c-man:#c8102e; --c-att:#b8862b; --c-att-ink:#8a6114; --c-cap:#7a8594; --c-cir:#2457c5; --c-bug:#7a3fb5;
  --a0:#c8102e; --a1:#e06c00; --a2:#0f7a8a; --a3:#2e8b3e; --a4:#2457c5; --a5:#7a3fb5; --a6:#b8860b; --a7:#5b6b7f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-man:#ff5a6e; --c-att:#d6a24a; --c-att-ink:#d6a24a; --c-cap:#a3adb9; --c-cir:#6f9bff; --c-bug:#b98bf0; --a0:#ff4d63; --a1:#ff9a3c; --a2:#3cc3d4; --a3:#5fd06f; --a4:#6f9bff; --a5:#b98bf0; --a6:#e6b84a; --a7:#9aa8b8;
  --bg:#12161b; --surface:#1b2129; --ink:#e8ebef; --muted:#9aa4b0; --line:#2c343e;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#3fa3b3; --accent:#fdeb05; --accent-ink:#14181d; --accent-soft:#2c343e;
  --bas:#4cb25c; --bas-soft:#15301d; --ava:#ff3b45; --ava-soft:#3d1417; color-scheme:dark;}}
:root[data-theme="dark"]{
  --c-man:#ff5a6e; --c-att:#d6a24a; --c-att-ink:#d6a24a; --c-cap:#a3adb9; --c-cir:#6f9bff; --c-bug:#b98bf0; --a0:#ff4d63; --a1:#ff9a3c; --a2:#3cc3d4; --a3:#5fd06f; --a4:#6f9bff; --a5:#b98bf0; --a6:#e6b84a; --a7:#9aa8b8;
  --bg:#12161b; --surface:#1b2129; --ink:#e8ebef; --muted:#9aa4b0; --line:#2c343e;
  --brand:#fdeb05; --brand-ink:#14181d; --petrol:#3fa3b3; --accent:#fdeb05; --accent-ink:#14181d; --accent-soft:#2c343e;
  --bas:#4cb25c; --bas-soft:#15301d; --ava:#ff3b45; --ava-soft:#3d1417; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:3px solid var(--brand);padding:10px 16px 12px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;color:var(--ink);font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;margin:0;cursor:pointer;display:flex;align-items:center;gap:10px}
.brand span{background:var(--brand);color:var(--brand-ink);padding:0 7px;border-radius:5px}
.brand img{display:block}
@media (max-width:440px){.proto{display:none}.brand{font-size:1.35rem;gap:7px}.brand img{width:44px;height:44px}}
.proto{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto}
.back{border:0;background:none;font-size:1.4rem;color:var(--ink);cursor:pointer;padding:0 4px;display:none}
.search{display:flex;gap:8px}
#q{flex:1;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.levels{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;white-space:nowrap}
.menu{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.menu svg{width:22px;height:22px}
.search .menu{height:auto;width:46px;border-radius:8px}
.tool{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-decoration:none}
.tool .ico{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.1rem;color:#fff;background:var(--tc)}
.tool b{font-family:var(--display);font-size:1.2rem}
.tool p{margin:0;color:var(--muted);font-size:.9rem}
.soon{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle;font-family:var(--body)}
.norm{display:grid;gap:6px}
.normbody{padding:0 14px 14px;display:grid;gap:10px}
.normbody p{margin:0}
.normbody .nt{font-weight:600}
.normbody h4{margin:4px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lv{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.lv[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.info{flex:0 0 auto;margin-left:auto;border:2px solid var(--brand-ink);background:var(--brand);color:var(--brand-ink);border-radius:999px;width:36px;height:36px;font:700 1.15rem Georgia,serif;font-style:italic;box-shadow:0 2px 6px #0003;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:18px}
h2{font-family:var(--display);font-size:1.45rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-decoration:none;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:1.25rem}
.tile small{color:var(--muted);font-variant-numeric:tabular-nums}
.tile{border-top:4px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 12%,var(--surface)),var(--surface))}
.tile b{color:var(--tc)}
.k-man{--tc:var(--petrol)}.k-alt{--tc:var(--c-cap)}.k-cir{--tc:var(--c-cir)}.k-bug{--tc:var(--c-bug)}
.row{border-left:4px solid var(--rc,transparent)}
.t-manovra{--rc:var(--c-man)}.t-attrezzatura{--rc:var(--c-att)}.t-capitolo{--rc:var(--c-cap)}.t-cir{--rc:var(--c-cir)}.t-bug{--rc:var(--c-bug)}
.row .num{color:var(--rc,var(--muted))}
.t-attrezzatura .num{color:var(--c-att-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--lc)}
.p-man{background:var(--ava-soft);color:var(--c-man)}.p-att{background:color-mix(in srgb,var(--c-att) 22%,var(--surface));color:var(--c-att-ink)}.p-cap{background:var(--bg);color:var(--c-cap);border:1px solid var(--line)}
h3{color:var(--ink)}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.num{font-family:var(--display);font-size:1.1rem;color:var(--muted);min-width:2.2em;font-variant-numeric:tabular-nums}
.row .t{font-weight:500}
.row .s{grid-column:2;font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;vertical-align:middle;margin-right:4px}
.p-tipo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.p-warn{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.9rem;margin:0}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.btn{display:inline-flex;box-shadow:0 2px 0 #0002;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:12px 16px;border-radius:8px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.85rem;color:var(--muted)}
.cycle{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.cycle b{font-family:var(--display);font-size:1.1rem}
.empty{color:var(--muted);padding:12px 0}
footer{max-width:760px;margin:0 auto;padding:8px 16px 32px;font-size:.78rem;color:var(--muted)}
.area{display:grid;gap:8px}
.folds{display:grid;gap:8px}
.fold{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--fc,var(--line));border-radius:10px}
.fold>summary span{color:var(--fc)}
.fold .chip{border-color:color-mix(in srgb,var(--fc) 40%,var(--line))}
.fold .chip:hover{background:color-mix(in srgb,var(--fc) 12%,var(--surface))}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";margin-left:8px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.fold[open]>summary::after{transform:rotate(225deg)}
.fold>summary small{margin-left:auto;font-family:var(--body);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.fold>.chips{padding:0 14px 14px}
.fold>.list{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px}

.tool .ico{color:var(--ti,#fff)}
.altro-h{display:flex;align-items:center;gap:12px}
.sig{flex:0 0 auto;min-width:64px;text-align:center;font-family:var(--display);font-size:1.5rem;letter-spacing:.04em;color:#fff;background:#8a5a2b;border-radius:10px;padding:8px 10px;line-height:1}
.altro-h b{font-size:1.02rem}
.sk-head{display:grid;gap:8px}
.skid{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sk-sum{display:flex;gap:14px;flex-wrap:wrap;font-weight:600}
.leg-ok{color:#1d8a3a}.leg-ko{color:#d3202a}
.sk-g{margin:18px 0 6px;font-family:var(--display)}.sk-g small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.bag summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.bag summary::-webkit-details-marker{display:none}
.bag .sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);flex:0 0 auto}
.bag summary small{color:var(--muted);display:block;font-size:.78rem}
.bagn{min-width:0}
.bag[data-on="false"]{opacity:.85}
.tg{flex:0 0 auto;width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0}
.tgk{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.tg[aria-pressed="true"]{background:#1d8a3a;border-color:#1d8a3a}.tg[aria-pressed="true"] .tgk{left:21px;background:#fff}
.x-ckimg{flex:0 0 auto;width:68px;height:50px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
.bag .cnt{margin-left:auto;font-weight:600;font-size:.85rem;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.bag .cnt[data-done="true"]{background:#1d8a3a;color:#fff;border-color:#1d8a3a}
.cklist{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:4px}
.ck{display:flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.ckb{flex:1;display:flex;align-items:center;gap:8px;font:inherit;text-align:left;color:var(--ink);background:none;border:0;padding:9px 10px;cursor:pointer;min-height:44px}
.ckm{flex:0 0 auto;width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.ck[data-st="1"]{border-color:#1d8a3a;background:color-mix(in srgb,#1d8a3a 10%,var(--surface))}
.ck[data-st="1"] .ckm{background:#1d8a3a;border-color:#1d8a3a;color:#fff}.ck[data-st="1"] .ckm::after{content:"✓"}
.ck[data-st="2"]{border-color:#d3202a;background:color-mix(in srgb,#d3202a 10%,var(--surface))}
.ck[data-st="2"] .ckm{background:#d3202a;border-color:#d3202a;color:#fff}.ck[data-st="2"] .ckm::after{content:"✗"}
.ckt{flex:1}
.ckq{flex:0 0 auto;font-weight:700;min-width:2.2em}
.ckt small{display:block;color:var(--muted);font-size:.75rem}
.cks{display:flex;gap:4px;padding-right:8px;flex-wrap:wrap;justify-content:flex-end}
.schip{font-size:.75rem;font-weight:600;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c-att) 18%,var(--surface));color:var(--c-att-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fold.kit{margin:8px 10px;border-left:4px solid #fdeb05}
.fold.kit>summary>span{color:var(--ink)}
.bmar{font-weight:700}
.bart{font-weight:700;background:#fdeb05;color:#14181d;padding:0 4px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bart{background:none;color:#fdeb05;padding:0}}
:root[data-theme="dark"] .bart{background:none;color:#fdeb05;padding:0}
.row .t{font-weight:400}
.skg{margin:0;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.skg>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:14px 16px;background:var(--gc);color:#fff}
.skg>summary::-webkit-details-marker{display:none}
.skg>summary b{font-family:var(--display);font-size:1.15rem;display:block}
.skg>summary small{display:block;font-size:.8rem;opacity:.9}
.skg>summary::after{content:"▾";margin-left:8px;font-size:1.1rem}
.skg[open]>summary::after{content:"▴"}
.gcnt{margin-left:auto;font-size:.8rem;font-weight:600;white-space:nowrap}
.skg-b{padding:8px 10px 2px}
.skg-b .bag{margin:0 0 8px}
.bag:not([open])>:not(summary){display:none}
.bag{display:block}.bag[open]>summary{margin-bottom:10px}
.bag>summary{min-height:32px}
#splash{position:fixed;inset:0;z-index:999;background:#2c343e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash img{width:min(52vw,240px);height:auto;border-radius:22%}
#splash p{margin:0;color:#fff;font-family:var(--display);font-size:1.4rem;letter-spacing:.02em}
#splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 "norme": {
  "166": {
   "titolo": "Protezione personale degli occhi",
   "spiegazione": "Requisiti generali per occhiali e visiere di protezione: resistenza meccanica agli urti, qualità ottica e marcatura delle lenti e delle montature."
  },
  "341": {
   "titolo": "Dispositivi di discesa per salvataggio",
   "spiegazione": "Discensori per salvataggio: permettono a una persona di scendere da sola, o di essere calata da un ancoraggio, a velocità controllata fino a un luogo sicuro. Il fabbricante deve dichiarare il carico minimo e massimo ammesso (massimo almeno 100 kg): molti dispositivi sono certificati fino a 200 kg o più, quindi anche per calare due persone insieme (operatore con infortunato), purché il bugiardino lo indichi espressamente. La sigla riporta tipo e classe (es. 2A): la classe, da A a D, indica l'energia di discesa sopportata, cioè altezza e numero di discese. Nota: la EN 341 non è armonizzata come DPI, per cui la marcatura CE di questi attrezzi si riferisce di solito ad altre norme (es. EN 12841)."
  },
  "353": {
   "titolo": "Dispositivi anticaduta di tipo guidato",
   "spiegazione": "Dispositivi che scorrono lungo una linea di ancoraggio rigida (parte 1) o flessibile (parte 2) e si bloccano automaticamente in caso di caduta."
  },
  "354": {
   "titolo": "Cordini",
   "spiegazione": "Cordini di collegamento (fune, fettuccia o catena) usati come elemento di un sistema anticaduta o di trattenuta. Lunghezza massima 2 m, compresi connettori ed eventuale assorbitore."
  },
  "355": {
   "titolo": "Assorbitori di energia",
   "spiegazione": "Elementi che si lacerano o si deformano durante l'arresto di una caduta, limitando la forza trasmessa al corpo dell'operatore a non più di 6 kN."
  },
  "358": {
   "titolo": "Cinture di posizionamento sul lavoro e cordini di posizionamento",
   "spiegazione": "Sostengono l'operatore nella posizione di lavoro o gli impediscono di raggiungere il punto in cui potrebbe cadere. Non sono progettati per arrestare una caduta libera."
  },
  "360": {
   "titolo": "Dispositivi anticaduta di tipo retrattile",
   "spiegazione": "Dispositivi con fune o nastro che si avvolge automaticamente e si blocca in caso di caduta, come una cintura di sicurezza dell'auto."
  },
  "361": {
   "titolo": "Imbracature per il corpo",
   "spiegazione": "Imbracature complete anticaduta: sono l'unico tipo di imbracatura ammesso per arrestare una caduta. I punti di attacco anticaduta (sternale e dorsale) sono marcati con la lettera A."
  },
  "362": {
   "titolo": "Connettori",
   "spiegazione": "Moschettoni e maglie per i sistemi di protezione contro le cadute. Le classi indicano l'impiego: B base, M multiuso (caricabile anche sull'asse minore), Q a ghiera da avvitare (maglia rapida), T terminale, A di ancoraggio."
  },
  "363": {
   "titolo": "Sistemi di protezione individuale contro le cadute",
   "spiegazione": "Descrive come si combinano i componenti nei diversi sistemi: trattenuta, posizionamento sul lavoro, accesso con fune, arresto caduta e salvataggio."
  },
  "365": {
   "titolo": "Requisiti generali per istruzioni, manutenzione, ispezione e marcatura",
   "spiegazione": "Stabilisce cosa devono contenere le note informative dei DPI contro le cadute (i bugiardini) e prescrive l'esame periodico da parte di persona competente, almeno ogni 12 mesi."
  },
  "397": {
   "titolo": "Elmetti di protezione per l'industria",
   "spiegazione": "Proteggono soprattutto da oggetti che cadono dall'alto. Il sottogola è progettato per sganciarsi oltre un certo carico: per il lavoro in quota e in sospensione si usano caschi che rispondono anche ad altre norme."
  },
  "564": {
   "titolo": "Attrezzatura per alpinismo – Cordino",
   "spiegazione": "Cordini in fibra tessile con diametro da 4 a 8 mm, usati per anelli, nodi autobloccanti e collegamenti."
  },
  "566": {
   "titolo": "Attrezzatura per alpinismo – Anelli",
   "spiegazione": "Anelli in fettuccia o cordino cuciti o annodati, usati per ancoraggi, frazionamenti e collegamenti."
  },
  "567": {
   "titolo": "Attrezzatura per alpinismo – Bloccanti",
   "spiegazione": "Dispositivi che scorrono sulla corda in un senso e si bloccano nell'altro: maniglie, bloccanti ventrali e da piede."
  },
  "568": {
   "titolo": "Attrezzatura per alpinismo – Ancoraggi da ghiaccio",
   "spiegazione": "Ancoraggi da inserire nel ghiaccio, come le viti da ghiaccio, con requisiti di resistenza al carico."
  },
  "569": {
   "titolo": "Attrezzatura per alpinismo – Chiodi",
   "spiegazione": "Chiodi da roccia da piantare nelle fessure, con requisiti di resistenza secondo la direzione del carico."
  },
  "795": {
   "titolo": "Dispositivi di ancoraggio",
   "spiegazione": "Punti di ancoraggio per la protezione contro le cadute. Tipo A fissi su struttura, tipo B mobili e provvisori (come treppiedi e fettucce di ancoraggio), tipo C linee flessibili orizzontali, tipo D rotaie rigide, tipo E a corpo morto."
  },
  "813": {
   "titolo": "Cinture con cosciali",
   "spiegazione": "Imbracature basse con punto di attacco ventrale, per il posizionamento sul lavoro e l'accesso con fune. Da sole non sono un sistema di arresto caduta."
  },
  "892": {
   "titolo": "Attrezzatura per alpinismo – Corde dinamiche",
   "spiegazione": "Corde elastiche che assorbono l'energia di una caduta allungandosi. Possono essere intere, mezze o gemellari; la norma indica il numero di cadute normalizzate sopportate."
  },
  "893": {
   "titolo": "Attrezzatura per alpinismo – Ramponi",
   "spiegazione": "Ramponi da fissare agli scarponi per la progressione su neve dura e ghiaccio."
  },
  "958": {
   "titolo": "Dissipatori di energia per vie ferrate",
   "spiegazione": "Sistemi con due rami e dissipatore per la progressione su vie ferrate, che limitano la forza d'arresto in caso di caduta."
  },
  "959": {
   "titolo": "Ancoraggi per roccia",
   "spiegazione": "Ancoraggi fissi da installare in fori nella roccia (a espansione o resinati), con requisiti di resistenza a trazione e taglio."
  },
  "1077": {
   "titolo": "Caschi per sciatori",
   "spiegazione": "Caschi per lo sci alpino e lo snowboard, provati per urti tipici delle cadute sulla neve."
  },
  "1496": {
   "titolo": "Dispositivi di sollevamento per salvataggio",
   "spiegazione": "Dispositivi (per esempio verricelli e argani) che sollevano o calano una persona da un luogo pericoloso a uno sicuro."
  },
  "1497": {
   "titolo": "Imbracature di salvataggio",
   "spiegazione": "Imbracature da far indossare alla persona da soccorrere per sollevarla o calarla con un dispositivo di salvataggio."
  },
  "14987": {
   "titolo": "Cinghie di salvataggio",
   "spiegazione": "Cinghie o triangoli di evacuazione per il recupero e il trasporto della persona da salvare (titolo come riportato nel Manuale Basico)."
  },
  "1891": {
   "titolo": "Corde con guaina a basso coefficiente di allungamento",
   "spiegazione": "Corde semistatiche per accesso con fune, posizionamento e salvataggio. Tipo A per uso professionale e soccorso, tipo B con prestazioni inferiori."
  },
  "12275": {
   "titolo": "Attrezzatura per alpinismo – Connettori",
   "spiegazione": "Moschettoni per alpinismo. I tipi indicano la forma e l'impiego: B base, H a pera per mezzo barcaiolo, K per vie ferrate, X ovale, D direzionale, Q a ghiera."
  },
  "12277": {
   "titolo": "Attrezzatura per alpinismo – Imbracature",
   "spiegazione": "Imbracature per alpinismo: tipo A completa, tipo B piccola completa (per bambini), tipo C bassa, tipo D pettorale."
  },
  "12278": {
   "titolo": "Attrezzatura per alpinismo – Pulegge",
   "spiegazione": "Carrucole per alpinismo e soccorso, con requisiti di resistenza e di efficienza."
  },
  "12312": {
   "titolo": "Occhiali da sole (EN ISO 12312-1)",
   "spiegazione": "Protezione degli occhi dalla radiazione solare, importante su neve e ghiacciaio."
  },
  "12492": {
   "titolo": "Attrezzatura per alpinismo – Caschi per alpinisti",
   "spiegazione": "Caschi che proteggono da urti dall'alto, laterali, frontali e posteriori. Il sottogola trattiene il casco in testa anche in caso di caduta."
  },
  "12841": {
   "titolo": "Sistemi di accesso con fune – Dispositivi di regolazione della fune",
   "spiegazione": "Tipo A: anticaduta sulla linea di sicurezza. Tipo B: bloccanti di risalita sulla linea di lavoro. Tipo C: discensori sulla linea di lavoro."
  },
  "13089": {
   "titolo": "Attrezzatura per alpinismo – Attrezzi da ghiaccio",
   "spiegazione": "Piccozze e martelli da ghiaccio, con requisiti di resistenza diversi per uso alpinistico di base o tecnico."
  },
  "15151-1": {
   "titolo": "Dispositivi di frenatura con bloccaggio manuale assistito",
   "spiegazione": "Freni per la sicura in alpinismo che aiutano l'operatore a bloccare la corda (per esempio discensori assicuratori autofrenanti)."
  },
  "15151-2": {
   "titolo": "Dispositivi di frenatura manuale",
   "spiegazione": "Freni per la sicura in cui il bloccaggio dipende dalla mano dell'operatore (per esempio piastrine e secchielli)."
  },
  "16473": {
   "titolo": "Caschi per vigili del fuoco – Soccorso tecnico",
   "spiegazione": "Caschi per vigili del fuoco impegnati nel soccorso tecnico, compreso il soccorso in quota e in ambiente impervio."
  },
  "15151": {
   "titolo": "Attrezzatura per alpinismo – Dispositivi di frenatura",
   "spiegazione": "Freni per la sicura in alpinismo. La parte 1 riguarda i dispositivi con bloccaggio manuale assistito, la parte 2 quelli a frenatura manuale."
  },
  "1498": {
   "titolo": "Cinghie di salvataggio",
   "spiegazione": "Cinghie e anelli di salvataggio che, indossati sotto le ascelle o in vita, permettono di sollevare o calare una persona durante un soccorso. Classi A, B e C a seconda della forma e dell'uso."
  },
  "13157": {
   "titolo": "Apparecchi di sollevamento azionati a mano",
   "spiegazione": "Norma di sicurezza per argani e paranchi manuali usati come macchine di sollevamento (non specifica per i DPI). Si affianca alla EN 1496 nei verricelli usati anche per il soccorso."
  },
  "137": {
   "titolo": "Autorespiratori a circuito aperto ad aria compressa",
   "spiegazione": "Requisiti degli autorespiratori con maschera intera usati dai Vigili del Fuoco. Compare nei sistemi di posizionamento integrati sul telaio dell'autorespiratore."
  },
  "16415": {
   "sigla": "CEN/TS 16415",
   "titolo": "Dispositivi di ancoraggio per più utilizzatori",
   "spiegazione": "Specifica tecnica che integra la EN 795 per gli ancoraggi usati da più persone contemporaneamente: l'attrezzo deve dichiarare il numero massimo di utenti (es. tipo B fino a 2 persone)."
  },
  "1983": {
   "sigla": "NFPA 1983",
   "titolo": "Corde e attrezzature per il soccorso (USA)",
   "spiegazione": "Norma statunitense della National Fire Protection Association per corde, connettori e attrezzi da soccorso dei vigili del fuoco. Non vale come marcatura CE ma indica attrezzi pensati per carichi da soccorso (classi \"technical use\" e \"general use\"). Dal 2022 è confluita nella NFPA 2500."
  },
  "1865-1": {
   "titolo": "Barelle e attrezzature per il trasporto dei pazienti",
   "spiegazione": "Norma per le barelle e i dispositivi di trasporto del paziente in ambulanza e nel soccorso. Le barelle sanitarie sono dispositivi medici (Reg. UE 2017/745) e non DPI."
  }
 },

function search(q) {
  const words = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return null;
  const argHit = D.argomenti.filter(a => words.every(w => norm(a.nome + ' ' + a.codice + ' ' + a.sinonimi.join(' ')).includes(w))).map(a => a.codice);
  const score = (text, args) => {
    const t = norm(text); let s = 0;
    if (words.every(w => t.includes(w))) s += 3;
    if ((args||[]).some(a => argHit.includes(a))) s += 2;
    return s;
  };
  const sch = D.schede.filter(s => lvOk(lvOf(s))).map(s => [score(s.titolo + ' ' + s.id, s.argomenti), s]).filter(x => x[0]).sort((a,b) => b[0]-a[0]).map(x => x[1]);
  const bug = D.bugiardini.map(b => [score([b.titolo, b.produttore, (b.norme||[]).join(' '), (b.modelli||[]).map(m => (m.ref||'') + ' ' + m.nome).join(' ')].join(' '), b.argomenti), b]).filter(x => x[0]).sort((a,b) => b[0]-a[0]).map(x => x[1]);
  const cir = [];
  D.circolari.filter(c => lvOk(c.livelli)).forEach(c => {
    if (score(c.numero + ' ' + c.titolo, c.argomenti)) cir.push(circRow(c));
    c.allegati.forEach(a => { if (score(a.titolo, a.argomenti)) cir.push(circRow(c, a)); });
  });
  const alt = D.altri_manuali.filter(a => score(a.titolo + ' ' + a.sigla + ' ' + a.descrizione, a.argomenti));
  return {argHit, sch, bug, cir, alt};
}

const normBase = n => { const s = String(n); if (/^ANSI/.test(s)) return; const m = s.match(/(?:EN|TS|NFPA)\s?(\d{3,5}(?:-\d)?)/) || s.match(/(\d{3,5}(?:-\d)?)/); let k = m && m[1]; if (k && !D.norme[k] && D.norme[k.split('-')[0]]) k = k.split('-')[0]; return k; };
const normLabel = k => (D.norme[k] && D.norme[k].sigla) || 'EN ' + k;
function normIndex() {
  const idx = {};
  const get = k => (idx[k] = idx[k] || {bug: [], arg: [], sch: []});
  Object.keys(D.norme).forEach(get);
  D.bugiardini.forEach(b => (b.norme || []).forEach(n => { const k = normBase(n); if (k) get(k).bug.push(b); }));
  D.argomenti.forEach(a => a.sinonimi.forEach(x => { if (/EN ?\d/.test(x)) { const k = normBase(x); if (k) get(k).arg.push(a); } }));
  D.schede.forEach(s => (s.norme || []).forEach(n => get(n).sch.push(s)));
  return Object.entries(idx).sort((a, b) => (!!(D.norme[a[0]] || {}).sigla - !!(D.norme[b[0]] || {}).sigla) || parseInt(a[0]) - parseInt(b[0]) || a[0].localeCompare(b[0]));
}
function viewNorme(open) {
  const rows = normIndex().map(([k, v]) => {
    const info = D.norme[k] || {titolo: 'Norma citata nei documenti', spiegazione: ''};
    const sch = [...new Set(v.sch)].filter(s => lvOk(lvOf(s))), bugs = [...new Set(v.bug)], args = [...new Set(v.arg)];
    const n = sch.length + bugs.length;
    return `<details class="fold" id="n-${k}" style="--fc:#2457c5"${open === k ? ' open' : ''}><summary><span>${esc(normLabel(k))}</span><small>${n}</small></summary>
      <div class="normbody"><p class="nt">${esc(info.titolo)}</p>${info.spiegazione ? `<p>${esc(info.spiegazione)}</p>` : ''}
      ${sch.length ? `<h4>Schede materiali dei manuali</h4>${list(sch.map(schedaRow))}` : ''}
      ${bugs.length ? `<h4>Bugiardini</h4>${list(bugs.map(bugRow))}` : ''}
      ${args.length ? `<h4>Argomenti</h4>${argChips(args.map(a => a.codice))}` : ''}</div></details>`;
  }).join('');
  return `<h2>Normative EN</h2><p class="note">Tocca una norma per leggere la spiegazione e vedere i materiali che la riportano. Titoli dal Manuale SAF Basico (§ 6.5) dove presenti; le spiegazioni sono sintesi indicative, in attesa delle schede di approfondimento.</p><div class="folds">${rows}</div>`;
}

const sSave = () => { try { localStorage.setItem(SK, JSON.stringify(sState)); } catch(e) {} };
const GRC = {s1: '#d3202a', s2: '#1f5fc4', si: '#6b7280'};
const BAGC = {nero: '#1b1b1b', rosso: '#d3202a', blu: '#1f6fd0'};

  <div class="btns"><button class="btn" id="skcopy">Copia riepilogo</button><button class="btn ghost" id="skreset">Azzera controllo</button></div><p class="note" id="skmsg" style="margin:0"></p></div>
  ${S.gruppi.map(g => `<details class="skg" style="--gc:${GRC[g.id] || '#666'}"${g.contenitori.some(c => sOn(c.id)) ? ' open' : ''}><summary><span><b>${esc(g.nome)}</b><small>${esc(g.sotto)}</small></span><span class="gcnt" data-gcnt="${g.id}"></span></summary><div class="skg-b">${g.contenitori.map(cont).join('')}</div></details>`).join('')}
  <div class="card"><b>Fonte</b><p style="margin:0">${esc(f.titolo)} – ${esc(f.ente)}, ${esc(f.ed)}.</p>${S.note.map(n => `<p class="note" style="margin:0">${esc(n)}</p>`).join('')}<div class="btns"><a class="btn" href="${pdf(f.url, 22)}">Apri il capitolato</a></div></div>`;

function sSummary() {
  const el = document.getElementById('sksum'); if (!el) return;
  const act = sItems(true), n = sCount(act), nb = D.sacche.gruppi.flatMap(g => g.contenitori).filter(c => sOn(c.id)).length;

  D.sacche.gruppi.forEach(g => { const k = document.querySelector(`[data-gcnt="${g.id}"]`); if (k) { const on = g.contenitori.filter(c => sOn(c.id)).length; k.textContent = on ? on + ' attiv' + (on === 1 ? 'o' : 'i') : ''; } });
  D.sacche.gruppi.forEach(g => g.contenitori.forEach(c => { const k = document.querySelector(`[data-cnt="${c.id}"]`); if (k) { const m = sCount(c.voci.map((v, i) => ({id: c.id + '-' + i}))); k.textContent = (m.ok + m.ko) + '/' + m.tot; k.dataset.done = String(m.ok + m.ko === m.tot); } }));

function sReport() {
  const act = sItems(true), n = sCount(act), d = new Date();
  const lines = [`CONTROLLO SACCHE SAF BASICO – ${d.toLocaleDateString('it-IT')} ${d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'})}`];

/* --- uso senza rete (service worker) --- */
const ALLFILES = [...new Set([...D.manuali.map(m => m.url), ...D.circolari.flatMap(c => [c.url, ...c.allegati.map(a => a.url)]), ...D.bugiardini.map(b => b.url), ...(D.altri_manuali || []).map(a => a.url), ...(D.sacche ? [D.sacche.fonte.url] : [])])];
async function offlineStatus() {
  const el = document.getElementById('offmsg'); if (!el) return;
  if (!('caches' in window) || !('serviceWorker' in navigator)) { el.textContent = 'Questo browser non permette l\'uso senza rete.'; return; }
  try {
    const c = await caches.open('saf-pdf'); let n = 0;
    for (const f of ALLFILES) if (await c.match(new URL(f, location.href).href)) n++;
    el.textContent = n + ' documenti su ' + ALLFILES.length + ' disponibili senza rete.';
  } catch (e) { el.textContent = 'Stato non disponibile.'; }
}
function bindOffline() {
  const b = document.getElementById('offline'); if (!b) return;
  offlineStatus();
  b.addEventListener('click', async () => {
    const reg = await navigator.serviceWorker?.ready;
    if (!reg || !reg.active) { document.getElementById('offmsg').textContent = 'Riprova tra qualche secondo: l\'app si sta ancora preparando.'; return; }
    b.disabled = true; document.getElementById('offmsg').textContent = 'Scaricamento in corso…';
    reg.active.postMessage({type: 'cacheAll', files: ALLFILES});
  });
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'progress') return;
    const el = document.getElementById('offmsg');
    if (el) el.textContent = 'Scaricati ' + e.data.done + ' di ' + e.data.total + (e.data.failed ? ' (' + e.data.failed + ' non riusciti)' : '');
    if (e.data.done === e.data.total) { const b = document.getElementById('offline'); if (b) b.disabled = false; offlineStatus(); }
  });
}

/* --- routing sull'hash --- */
function render() {
  const h = location.hash.slice(1);
  const q = $('#q').value.trim();
  let html;
  if (q && (!h || h === 'home')) html = viewSearch(q);
  else if (h === 'info') html = viewInfo();
  else if (h === 'menu') html = viewMenu();
  else if (h.startsWith('t-')) html = viewStrumento(h.slice(2));
  else if (h.startsWith('n-')) html = viewNorme(h.slice(2));
  else if (h === 'altri') html = viewAltri();
  else if (h === 'manuali') html = viewManuali();
  else if (h === 'circolari') html = viewCircolari();
  else if (h === 'bugiardini') html = viewBugiardini();
  else if (h.startsWith('m-')) html = viewManuale(h.slice(2));
  else if (h.startsWith('s-')) html = viewScheda(h.slice(2));
  else if (h.startsWith('a-')) html = viewArgomento(h.slice(2));
  else if (h.startsWith('c-')) html = viewCircolare(h.slice(2));
  else if (h.startsWith('b-')) html = viewBugiardino(h.slice(2));
  else html = viewHome();
  $('#view').innerHTML = html;
  $('#back').style.display = h && h !== 'home' ? 'block' : 'none';
  if (h.startsWith('n-')) { const el = document.getElementById(h); if (el && el.scrollIntoView) setTimeout(() => el.scrollIntoView({block: 'start'}), 0); }
  bindSacche();
  bindOffline();
  const cm = document.getElementById('copymail');
  if (cm) cm.addEventListener('click', async () => { try { await navigator.clipboard.writeText('vvfpordenonesaf@gmail.com'); document.getElementById('copymsg').textContent = 'Indirizzo copiato.'; } catch (e) { document.getElementById('copymsg').textContent = 'Copia non riuscita: seleziona l\'indirizzo a mano.'; } });
}
function setLevel(lv) {
  if (lv === '__init__') {}
  else if (!lv) levels.clear();
  else if (levels.has(lv)) levels.delete(lv); else levels.add(lv);
  const avail = D.livelli.filter(l => levelHasContent(l.id)).map(l => l.id);
  if (avail.every(x => levels.has(x))) levels.clear();
  try { localStorage.setItem('saf-levels', JSON.stringify([...levels])); } catch(e) {}
  document.querySelectorAll('.lv').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lv ? levels.has(b.dataset.lv) : !levels.size)));
  render();
}

$('#brand').addEventListener('click', () => { $('#q').value = ''; location.hash = 'home'; render(); });
$('#back').addEventListener('click', () => history.back());
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== 'home') { } render(); window.scrollTo(0, 0); });
setLevel('__init__');

/* --- schermata iniziale con il logo --- */
(() => {
  const src = document.querySelector('#brand img')?.src; if (!src) return;
  const s = document.createElement('div'); s.id = 'splash';
  s.innerHTML = `<img src="${src}" alt=""><p>Supporto Operatore</p>`;
  document.body.appendChild(s);
  const hide = () => { s.classList.add('out'); setTimeout(() => s.remove(), 600); };
  setTimeout(hide, 2500);
  s.addEventListener('click', hide);
})();
</script>
</body>
</html>
